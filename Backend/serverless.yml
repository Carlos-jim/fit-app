service: bioma-backend

frameworkVersion: "4"

provider:
  name: aws
  runtime: nodejs22.x
  region: ${env:AWS_REGION, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  environment:
    DATABASE_URL: ${env:DATABASE_URL}
    OPENAI_API_KEY: ${env:OPENAI_API_KEY}
    OPENAI_MODEL: ${env:OPENAI_MODEL, 'gpt-4.1-mini'}
    S3_UPLOAD_BUCKET: ${env:S3_UPLOAD_BUCKET}
    AWS_REGION: ${env:AWS_REGION, 'us-east-1'}
    S3_SIGNED_URL_TTL_SECONDS: ${env:S3_SIGNED_URL_TTL_SECONDS, '900'}

functions:
  analyzeMealImage:
    handler: dist/functions/analyze-meal.handler
    events:
      - httpApi:
          path: /logs/analyze-meal-image
          method: post
  analyzeMealText:
    handler: dist/functions/analyze-meal-text.handler
    events:
      - httpApi:
          path: /logs/analyze-meal-text
          method: post
  createMealUploadUrl:
    handler: dist/functions/create-meal-upload-url.handler
    events:
      - httpApi:
          path: /uploads/meal-image-url
          method: post
  bootstrapUser:
    handler: dist/functions/bootstrap-user.handler
    events:
      - httpApi:
          path: /users/bootstrap
          method: post
  getLogs:
    handler: dist/functions/get-logs.handler
    events:
      - httpApi:
          path: /logs
          method: get
